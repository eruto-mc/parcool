# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# supported minimum Minecraft version
mc_version=1.20.1
# Removing items, blocks, tile entities, etc.
major_mod=3
# Changing the order or variables of enums. etc
major_api=4
# Adding items, blocks, tile entities, etc.
minor=3
# bugfix
patch=3

# ── マイクラ部（eruto）の当部パッチの版 ───────────────────────────
# ⚠ **上流と同じ名前の jar を吐かせない。** 素のビルドは上流と同名（ParCool-1.20.1-3.4.3.3.jar）で、
#    以前は人が手で `-eruto1` を付け直す運用だった。付け忘れれば `fetch_mods.py --download` の
#    全走が素の版で上書きしてパッチが消えるし、置いてある jar がどの版か誰にも分からない。
#    ここを上げるだけで、jar 名・ゲーム内のMOD一覧・ログの版表示が全部そろって変わる。
# **当部でソースを変えたら、必ずこの数を1つ上げる。**
#   1 … FastRun のスプリント維持／受け身の Auto／Vault の視線許容角 60°
#   2 … Vault の動作時間 11→8 ／ キャットリープのクールタイム 30→20
eruto_patch=2

forge_version=47.4.0
patchouli_version=1.20.1-81-FORGE
epicfight_version=7035137
jei_version=15.20.0.105
