#       ⚠ 既定キーも重なる（壁キック＝スペース＝馬のジャンプ）。⚠ 技ごとに足すと
#       21 か所になるので、⚠ **すべての技が通る関所（ActionProcessor）で 1 行**にした
#  28 … ⚠⚠ 手引書の技の頁に「使う／使わない」のトグルを置いた（2026-09-05・あなたの案）。
#       ⚠ **まず壁キックの1つだけ**（段1）。実物を見てから 27 技へ広げる。
#       ⚠ Patchouli の `ICustomComponent` を独自部品として置き、保存は既存の設定画面と
