# ── マイクラ部（eruto）の当部パッチの版 ───────────────────────────
# ⚠ **上流と同じ名前の jar を吐かせない。** 素のビルドは上流と同名（ParCool-1.20.1-3.4.3.3.jar）で、
#    以前は人が手で `-eruto1` を付け直す運用だった。付け忘れれば `fetch_mods.py --download` の
#    全走が素の版で上書きしてパッチが消えるし、置いてある jar がどの版か誰にも分からない。
#    ここを上げるだけで、jar 名・ゲーム内のMOD一覧・ログの版表示が全部そろって変わる。
# **当部でソースを変えたら、必ずこの数を1つ上げる。**
#   1 … FastRun のスプリント維持／受け身の Auto／Vault の視線許容角 60°
#   2 … Vault の動作時間 11→8 ／ キャットリープのクールタイム 30→20
#   3 … 属性 `parcool:wall_climb` を足し、垂直ウォールランの**登る高さ**と
#       **次に始められるまでの間隔**を種族ごとに変えられるようにした
#   4 … 属性 `parcool:parkour` を足し、パルクールそのものを人ごとに止められるようにした
#   5 … ジップラインの上限 115→320 ／ ジャスト受け身の音を金床からアメジストへ ／
#       壁ジャンプを視線ではなく移動入力の向きへ蹴るようにした ／
#       壁駆け上がりから「上を向く」条件を外し、属性 `parcool:wall_climb_chain` で
#       空中での再開を許せるようにした
#   6 … eruto5 の取りこぼし。⚠ `parcool:wall_climb_chain` を**プレイヤーに付けていなかった**
#       （レジストリに登録しただけでは持たない）。Origins が「Can't find attribute」で
#       ワールド参加直後にクライアントを落としていた
#   7 … 初回参加で手引書を配る進捗を止めた（`minecraft:impossible`）。
#       ⚠ **これまでは world-3 の datapack が同じ id を上書きして止めていた**——
#       同じ内容が2か所に在る形だったので、fork の側へ寄せた。
#       ⚠ **datapack の上書きは、この jar を配る日に外す**（先に外すと本が配られ始める）
#   8 … 属性 `parcool:dodge_distance` と `parcool:dodge_recovery` を足し、
#       回避の距離と、続けて回避した後の待ちを種族ごとに変えられるようにした
#   9 … 乗り越えの動作時間 8→6（2026-09-02・あなたの指示）。⚠ **配る前に 10 へ上げたので、
#       この番号の jar は手元にしか無い**
#  10 … スライディングが坂で速くなるようにした（2026-09-02・あなたの指示）。
#       ⚠ **上流は接地していないティックを 0.6 倍にしており、段差は落ちる間ずっと浮くので、
#       階段を下ると速くなるどころか遅くなっていた**。真下 2.5 ブロック以内に地面が在る
#       下りだけを対象に、下った高さのぶん最大2倍まで上乗せし、その間は持ち時間を減らさない
#  11 … ⚠ eruto10 の取りこぼし2つと、ジップラインの音、三人称の回避（2026-09-03）。
#       ⚠ **坂の判定は深さだけでは足りなかった**——階段は1マス進んで1マス下がるので、
#       速くなるほど段を飛び越えて宙を飛び、自分の加速で判定から外れていた。
#       宙に浮いているティックだけ下向きに 0.15 足して坂へ引き寄せる。
#       ジップラインは滑っている間ずっと音が鳴る（バニラのエリトラの滑空音を借りる）。
#       ⚠ 移動キーの判定を「キーの押下が先・input は控え」に変えた——
#       Better Third Person が input を毎ティック書き換えるので、
#       **三人称では回避が一度も出ていなかった**
#  12 … ⚠⚠ eruto11 の**サーバが起動しなかった**のを直した（2026-09-03）。
#       ジップラインの音を作る行が `onStartInLocalClient` に在り、⚠ **その印が無かった**ので
#       サーバでもメソッドが残り、SoundInstance の解決で ParCool ごと落ちていた
#  13 … 坂の加速を線形から二次へ（2段下りただけで走りの2.25倍だった）。
#       ジップラインの音が鳴っていなかったのを直した——`sounds.json` の
#       `"type": "event"` 参照をファイルパスへ、初期音量 0 → 0.1（2026-09-03）
#  14 … 坂の加速を物理の式へ作り直した（2026-09-03）。⚠ **前の2つ（線形・二次）は
#       坂の急さを見ておらず、当部が考えた式だった**。いまは重力の斜面成分から摩擦を
#       引く形。⚠ 併せて、段の角で押し上げられた分を捨てて跳ねを止めた
#  15 … ⚠ 段の角で跳ねるのを、速度ではなく**段差を登る高さ**の側で止めた（2026-09-03）。
#       ⚠ eruto14 で入れた「上向きの速度を捨てる」は的外れだった——
#       バニラの持ち上げは Entity#move が位置を直に動かすもので、速度を通らない
#  16 … 滑っている間、足元のすぐ下に地面が在るならそこへ吸い付けるようにした
#       （2026-09-03・あなたの案）。⚠ 併せて eruto15 の重い取りこぼしを直した——
#       段差の削りを onStop で戻していたが、⚠ **onStop は一度も呼ばれていない**ので、
#       一度滑ると以後ずっと段差を登れないままだった
#  17 … 吸着を直した（2026-09-03・あなたの指摘）。⚠⚠ **「坂を下っている間」を
#       条件にしていたので、跳ね上がっている最中はそもそも働いていなかった**。
#       滑っている間は常に当て、深さを 1.5 → 0.5 にし、速度ではなく位置で置く。
#       ⚠ 併せて高さの定数3つを体格でスケールするようにした（種族で大きさが違う）
#  18 … 段差の削りを**下っている間だけ**にした（2026-09-03・あなたの指摘）。
#       ⚠ eruto17 で初めて削りが効き、⚠ **上りや平地で段に引っかかるようになっていた**。
#       跳ねを止めたいのは下りだけなので、そこに絞る
#  19 … ⚠⚠ 跳ねの正体が分かった（2026-09-03）。ParCool は移動の**後**（Phase.END）に
#       動くので、「バニラが段差登りで持ち上げる → 吸着が戻す」を毎ティック繰り返して
#       上下していた。⚠ eruto18 の「下りだけ削る」は**振動を自分で作っていた**——
#       上がったティックは下っていない扱いで削りが外れ、また登れてしまう。
#       滑っている間はずっと、段差を1つも登らせない（削り 0.5 → 0.6）
#  20 … ⚠⚠ 地面への吸着を**外した**（2026-09-03）。⚠ 段差登りを止めた今は戻す相手が
#       居ないうえ、⚠ **中心から1本レイを撃つだけの探し方**が段の縁で誤り、
#       体を手前の段へめり込ませていた。⚠ **ハーフブロックの階段を下るときの
#       引っかかり**がこれ。残すのは段差の削りと、宙に浮いたときの引き寄せだけ
#  21 … ⚠⚠ 滑りの速さに**速さ応じの抵抗**（`− 0.12 × v²`）を足した（2026-09-04）。
#       ⚠ 摩擦だけだと傾き 5.7 度を超える坂はどれも上限へ張り付き、⚠ **どの坂でも
#       同じ 18 m/s** だった。抵抗を入れると落ち着く速さが坂ごとに決まる
#       （45度の階段で 13.0 m/s）。⚠ 上限は 0.9 → 0.8 に下げて安全弁の役だけにした
#  22 … ⚠⚠ 受け身の Auto が出ない穴を塞いだ（2026-09-04）。⚠ 2026-09-02 に
#       「移動の向きはキーの押下を先に見る」を入れたとき、⚠ **向き読み4つだけ直して
#       `isAnyMovingKeyDown()` を取りこぼしていた**。⚠ この口を読むのは受け身の Auto
#       だけで、⚠ **三人称では「移動キーを押していない」と読めて受け身が出なかった**
#  23 … ⚠⚠ 上流が「水平速度を固定値で書き直す」型を、残り2か所も直した（2026-09-04）。
#       ⚠ CatLeap は normalize() で入りの速さを捨て、跳躍が**常に 1.0 ブロック/tick**
#       だった（速さを積む意味が無い）。⚠ HorizontalWallRun は **0.2＝4.0 m/s** 固定で、
#       ⚠⚠ **バニラの歩きより遅かった**。⚠ どちらも上流自身が WallJump ではやっている
#       「入ってきた勢いを足す」へ揃えた。⚠ 併せて壁走りの角度許容を 26°→37° に緩めた
#  24 … ⚠⚠ 滑走からのキャットリープを、実際に跳べる形にした（2026-09-04・あなたの案）。
#       ⚠ 上流の封じは `jumpFromGround` の HEAD を潰すので、⚠⚠ **CatLeap 自身の
#       `jumpFromGround()` まで止まっており、滑走から出ると水平に飛ぶだけだった。**
#       ⚠ 併せて引き金にジャンプを足した——SHIFT はしゃがみなので、⚠ **勢いを乗せたいのに
#       乗せる操作が勢いを削っていた**。⚠ 速さも Slide から直に採る（deltaMovement は
#       処理順のせいで摩擦後の値だった）
#  25 … ⚠⚠ 滑走から跳んだ速度を Slide が上書きしていたのを止めた（2026-09-04）。
#       ⚠ `ActionProcessor` は ActionList の順に「開始 → working tick」を回す。
#       CatLeap 17 番・Slide 36 番なので、⚠⚠ **跳躍の速度を書いた直後、同じティックで
#       Slide が setDeltaMovement で上書きしていた**。⚠ 跳んだ直後は接地も坂でもないので
#       0.6 倍が掛かり、⚠ **滑走より遅くなっていた**。Slide の canContinue で終える
#  26 … ⚠⚠ 手引書が JEI（とクリエイティブ）に出ていなかったのを直した（2026-09-05）。
#       ⚠ Patchouli は `creative_tab` を書いていない本を**既定の入れ先にしか置かない**ので、
#       ⚠⚠ **JEI の一覧に載らない**。当部の本 10 冊のうち、載っていなかったのはこれと
#       ハムスターの2冊で、⚠ **どちらも `creative_tab` を書いていない本**だった。
#       ⚠ しかも上流は `parcool:items` タブの**アイコンに本を使いながら**、
#       `displayItems` に本を入れていない。⚠ `book.json` に 1 行足して自分のタブへ入れる
#  27 … ⚠⚠ 乗り物に乗っている間はパルクールをしないようにした（2026-09-05）。
#       ⚠ **馬に乗ったまま壁キックができた**（あなたが実物で確認）。⚠ 上流は乗り物の
#       判定を **26 技のうち 5 つにしか書いておらず**、壁キックには無い。⚠⚠ しかも
